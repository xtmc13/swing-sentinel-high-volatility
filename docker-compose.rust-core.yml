services:
  swing-rust-core:
    build:
      context: ./rust-core
      dockerfile: Dockerfile
    container_name: swing-rust-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 2.0
